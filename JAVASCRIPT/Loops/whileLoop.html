<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>whileLoop</title>
</head>
<body bgcolor="skyblue">
    <center><h1>WHILE LOOPS</h1>
    <script>
        var i=1;
        while(i<=51) {
            document.write(i+"</br>")
            i=i+2; //increment/decrement opr
        } 
    </script>
    </center>
</body>
</html>
