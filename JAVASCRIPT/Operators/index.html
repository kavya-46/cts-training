<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>operators in JS</title>
</head>
<body bgcolor="lightpink">
<center><h1>Operators in JS</h1></center>    
<script>
    var x=10;
    var y=20;
//arithmetic operators
    document.writeln(x+y);
    document.writeln(x-y);
    document.writeln(x*y);
    document.writeln(x/y);
    document.writeln(x%y);
    document.writeln(x++);
    document.writeln(y--);
    document.writeln(--x);

//assignment ops
var q=1; 
document.writeln(q+10);
q=q+12;
document.writeln(q);
q+=10; //q=q+10;
document.writeln(q);
q-=10;
document.writeln(q);
q*=10;
document.writeln(q);
q/=10;
document.writeln(q);
q%=10;
document.writeln(q);

//comparison/ relational operators

</script>
</body>
</html>
