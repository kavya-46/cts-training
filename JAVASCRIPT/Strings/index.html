<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>String Objects</title>
</head>
<body bgcolor="pink" text="blue">
    <center>
        <h1>String Objects in JS</h1>
        <script>
            var x = "hello guys";
            var y = "welcome";
            document.write(x+y+"</br>");
            document.write(x+"</br>");

            var x = new String("biryani is so good");
            document.write(x+"</br>");

            document.write(x.charAt(2)+"</br>");

            document.write(x.indexOf("biryani")+ "</br>");
            document.write(x.toLowerCase()+"</br>");
            document.write(x.slice(2,5)+"</br>");

        </script>
    </center>
    
</body>
</html>
