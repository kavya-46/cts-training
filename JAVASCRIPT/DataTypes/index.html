    <title>Datatypes</title>
</head>
<body bgcolor="lightgreen">
    <center><h1>DATATYPES in JS</h1></center>
    <script>
var x=27.5; //num dataType
document.writeln(x);

var name="kavya"; //string datatype
document.writeln("my name is "+name)

var konduru = true; //boolean datatype
document.writeln(konduru);

var x=37;  //regurlar expresion
var y=25;
var z = x+y;
document.writeln(z);

document.write(typeof(z));
    </script>
